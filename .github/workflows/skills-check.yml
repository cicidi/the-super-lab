name: Skills check

on:
  push:
    branches: [main, master, "refactor/**"]
    paths:
      - "skills/**"
      - "personal-skills/**"
      - "tools/check_skills.py"
      - ".github/workflows/skills-check.yml"
  pull_request:
    paths:
      - "skills/**"
      - "personal-skills/**"
      - "tools/check_skills.py"
      - ".github/workflows/skills-check.yml"

jobs:
  check-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # retired skill names come from git history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Check every SKILL.md
        run: python3 tools/check_skills.py
