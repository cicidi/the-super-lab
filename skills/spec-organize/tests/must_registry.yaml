version: 1
items:
  - id: MUST-A
    source: docs/features/spec-driven-development/features/document-standard/design/document-standard-design.md:98
    text: '**文件名规则（MUST）。** 提交的文档必须放在对应类型的目录里，文件名以 `<f>-<type>` 开头。有两种例外：`raw/` 下的文件；被某篇文档引用的辅助文件，它放在 `docs/features/<f>/<type>/<来源名>.md`，行数上限和它所在的类型相同。不允许单独建一个 `reference/` 类型；外部资料放在辅助文件里，或者放进 `raw/`。'
    method: python
    check: 'paths'
  - id: MUST-B
    source: docs/features/spec-driven-development/features/document-standard/design/document-standard-design.md:111
    text: '这六种都要提交到 git。六种都可以拆分篇；有分篇时，必须有入口文件 `<f>-<type>.md`，入口文件链到各分篇（MUST，[ARD-BQ](../../../decision-history/spec-driven-development-decision-history.md#ard-bq)）。分篇的命名规则：prd、design、test-plan、how-to 用名词，说明这篇讲哪个方面；impl-plan 和 decision-history 用「序号加阶段或时期」，因为它们有先后顺序（[ARD-G](../../../decision-history/spec-driven-development-decision-history.md#ard-g)）。'
    method: llm
    check: ''
  - id: MUST-C
    source: docs/features/spec-driven-development/features/document-standard/design/document-standard-design.md:113
    text: '**行数（MUST）。** parent PRD 的 PRD-D 规定，除 decision-history 外，任何文档不超过 1,000 行。各类型的具体数字：'
    method: python
    check: 'size'
  - id: MUST-D
    source: docs/features/spec-driven-development/features/document-standard/design/document-standard-design.md:129
    text: '3. 入口文件必须链到各分篇（ARD-BQ）。拆分时如果名字撞车，见 DSGN-K。'
    method: llm
    check: ''
  - id: MUST-E
    source: docs/features/spec-driven-development/features/document-standard/design/document-standard-design.md:152
    text: '这些路径必须写进 `.gitignore` 或用等效的办法排除。误提交算违反 DSGN-M 的 MUST。这些文件不需要 frontmatter、Change Log，也不进 INDEX。'
    method: python
    check: 'no_commit'
  - id: MUST-F
    source: docs/features/spec-driven-development/features/document-standard/design/document-standard-design.md:154
    text: '**本地翻译副本（MUST）。** `<name>.<lang>.md` 这样的翻译副本只放在本地，不提交。副本开头写明以 `<name>.md` 为准；副本里的标题可以翻译（[ARD-AU](../../../decision-history/spec-driven-development-decision-history.md#ard-au)）。'
    method: llm
    check: ''
  - id: MUST-G
    source: docs/features/spec-driven-development/features/document-standard/design/document-standard-design.md:173
    text: '- 质量要求（MUST）：磁盘上有、INDEX 里没列的，叫孤立文档；INDEX 里列了、磁盘上没有的，叫死链。两种都不允许。'
    method: python
    check: 'index_book'
  - id: MUST-H
    source: docs/features/spec-driven-development/features/document-standard/design/document-standard-design.md:186
    text: '- 原文还是 `state: draft` 时，可以暂不更新摘要；`final` 或已合并的改动必须反映到 book。'
    method: llm
    check: ''
  - id: MUST-I
    source: docs/features/spec-driven-development/features/document-standard/design/document-standard-design.md:198
    text: '**frontmatter（MUST）。** 每篇已提交的文档开头都有：'
    method: python
    check: 'frontmatter'
  - id: MUST-J
    source: docs/features/spec-driven-development/features/document-standard/design/document-standard-design.md:211
    text: '**必需章节（MUST）。** 每种文档必须有下面这些 `##` 章节。标题用英文原文，不翻译、不编号、不改名、不删；可以另外加章节。比如把 Overview 写成 `## 1. 概述` 就违反规则。其他章节只有写有序步骤时才编号；例外是 Problem Statement 下面作者原话的小标题可以保留编号（[ARD-BS](../../../decision-history/spec-driven-development-decision-history.md#ard-bs)）。'
    method: python
    check: 'sections'
  - id: MUST-K
    source: docs/features/spec-driven-development/features/document-standard/design/document-standard-design.md:240
    text: '**impl-plan 正文（MUST，由 spec-write 执行）。** 每个 `IMPL-*` 写明三件事：依赖哪个任务、挡住了哪个任务、完成标准。依赖和挡住要两头对得上：A 写了挡住 B，B 就要写依赖 A。最后的执行顺序把被挡住的任务排在后面，例如先改数据库，再改用到它的接口。优先级高又没被挡住的先做；互不相挡的可以同时做。先做只读的部分，再做会写入的部分；对方的接口还没上线时，写明用什么 mock 代替（[ARD-AT](../../../decision-history/spec-driven-development-decision-history.md#ard-at)）。'
    method: llm
    check: ''
  - id: MUST-L
    source: docs/features/spec-driven-development/features/document-standard/design/document-standard-design.md:242
    text: '**引用代码（MUST）。** 写「某文件第几行」时，同时写明是哪个 commit（[ARD-AQ](../../../decision-history/spec-driven-development-decision-history.md#ard-aq)）。'
    method: python
    check: 'code_citation_base'
  - id: MUST-M
    source: docs/features/spec-driven-development/features/document-standard/design/document-standard-design.md:244
    text: '**未决问题清单（MUST）。** 每个 feature 只有一份未决问题清单，一般是 design 的 `## Open Questions`；其他文档链过去，不抄一份。每个条目编号是 `QUES-` 加字母，写明问题、目前答案、负责人，以及是否阻塞（[ARD-AO](../../../decision-history/spec-driven-development-decision-history.md#ard-ao)、[ARD-AG](../../../decision-history/spec-driven-development-decision-history.md#ard-ag)）。在别处提到某个问题时，写的「未决」或「已决」要和清单一致（[ARD-BC](../../../decision-history/spec-driven-development-decision-history.md#ard-bc)）。'
    method: python
    check: 'open_questions'
  - id: MUST-N
    source: docs/features/spec-driven-development/features/document-standard/design/document-standard-design.md:246
    text: '**可读性（MUST）。** 来源：parent PRD 的 PRD-M。一个本科水平的程序员，只读这一篇和术语表，就要能读懂（[ARD-BO](../../../decision-history/spec-driven-development-decision-history.md#ard-bo)，由 parent test-plan 的 TST-V 检查）。具体要求：'
    method: llm
    check: ''
  - id: MUST-BA
    source: docs/features/spec-driven-development/features/document-standard/design/document-standard-design.md:253
    text: '**插图（MUST）。** 图里不写正文没有的事实，也不和正文矛盾；L1 内容不能只出现在图里。spec-review 发现时报严重度 3，并写出 SVG 文件名（[ARD-CA](../../../decision-history/spec-driven-development-decision-history.md#ard-ca)）。'
    method: llm
    check: ''
  - id: MUST-O
    source: docs/features/spec-driven-development/features/document-standard/design/document-standard-design.md:255
    text: '**Decision Log（MUST）。** 表头是 `ID | Date | Decision`，可以加第四列 `Ready`；不能有 Status 列和 Supersedes 列（[ARD-AX](../../../decision-history/spec-driven-development-decision-history.md#ard-ax)）。最新的决定写在表的最上面。'
    method: python
    check: 'decision_log'
  - id: MUST-P
    source: docs/features/spec-driven-development/features/document-standard/design/document-standard-design.md:257
    text: '**Change Log（MUST）。** 每篇文档的最后一节，只往末尾追加，不改旧行。'
    method: python
    check: 'change_log'
  - id: MUST-Q
    source: docs/features/spec-driven-development/features/document-standard/design/document-standard-design.md:274
    text: '**编号永不改（MUST）。** 一个编号一旦写进文档（表格、标题、正文、外部链接），就永远不变：不改字母、不改前缀、不「修正拼写」、不重新编号、不把一个条目并进另一个。用过的编号即使条目已作废，也不再给别的条目用。说法变了，就起一个新编号，旧的按 DSGN-J 处理。'
    method: llm
    check: ''
  - id: MUST-R
    source: docs/features/spec-driven-development/features/document-standard/design/document-standard-design.md:276
    text: '**迁移时留对照（MUST）。** 如果确实必须改编号（例如修正不合规的编号，要记一条 ARD），保留一张新旧编号对照表。标题改名时，把旧锚点留在新标题上方，旧链接才不会失效（[ARD-AP](../../../decision-history/spec-driven-development-decision-history.md#ard-ap)）。'
    method: llm
    check: ''
  - id: MUST-S
    source: docs/features/spec-driven-development/features/document-standard/design/document-standard-design.md:278
    text: '**凡是要被引用的都要编号（MUST）。** 需求、design 的规则小节、实现任务、测试用例、延后或未决的问题，都必须用上表的格式。不能用纯数字（`0001`），也不能用 `PRD-1`、`FR-3`、`OQ-1`、`QUES-1`、`D1` 这类数字编号。一个规则小节下面的子条款，可以在后面再加一个字母，例如 `DSGN-N-A`，只在本篇内使用。'
    method: python
    check: 'ids'
  - id: MUST-T
    source: docs/features/spec-driven-development/features/document-standard/design/document-standard-design.md:280
    text: '**编号的范围（MUST）。** 编号在「同一个 feature 的同一种文档」里唯一。引用别的 feature 的编号时写成 `<feature>/<编号>`，例如 `document-standard/DSGN-B`，或者在句子里写明是哪个 feature。不带 feature 的编号只在本 feature 内有意义。'
    method: llm
    check: ''
  - id: MUST-U
    source: docs/features/spec-driven-development/features/document-standard/design/document-standard-design.md:286
    text: '**改已有正文（MUST，由 spec-write 执行）。** 正文只写现行规则：不再成立的句子直接改写，在新句后面链到推翻旧说法的 ARD。删除线只用在 decision-history，正文的旧版本从 git 历史里找。错别字直接改（[ARD-BM](../../../decision-history/spec-driven-development-decision-history.md#ard-bm)、[ARD-AS](../../../decision-history/spec-driven-development-decision-history.md#ard-as)）。'
    method: llm
    check: ''
  - id: MUST-V
    source: docs/features/spec-driven-development/features/document-standard/design/document-standard-design.md:341
    text: '**每条都有一节说明（MUST）。** 每条 ARD 在 Evidence Appendix 里有一节，写明原因；当时考虑过别的做法，就写出放弃了哪些、为什么。'
    method: llm
    check: ''
