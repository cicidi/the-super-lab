  <path d="M120 50 H200" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="20" y="28" width="100" height="44" rx="6" fill="#fff" stroke="#bfc0c0"/>
  <text x="70" y="54" text-anchor="middle" font-size="12">Input</text>
  <rect x="200" y="28" width="100" height="44" rx="6" fill="#fff" stroke="#bfc0c0"/>
