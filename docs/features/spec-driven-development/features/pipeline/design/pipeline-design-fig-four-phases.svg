<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="four-phases-title four-phases-desc" viewBox="0 0 640 200" style="min-width:640px;background:#f5f5f5">
  <title id="four-phases-title">写 spec 的四个阶段</title>
  <desc id="four-phases-desc">Create、Map、Converge、Downstream 的顺序阶段。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  </defs>
  <path d="M146 100 H174" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M304 100 H332" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M462 100 H490" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="16" y="56" width="130" height="88" rx="6" fill="#fff" stroke="#bfc0c0"/>
  <text x="81" y="82" text-anchor="middle" font-family="Geist,'Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2d3142">1 Create</text>
  <text x="81" y="102" text-anchor="middle" font-family="Geist,'Noto Sans SC',sans-serif" font-size="11" fill="#4f5d75">暂定名、粗略 PRD</text>
  <rect x="174" y="56" width="130" height="88" rx="6" fill="#fff" stroke="#bfc0c0"/>
  <text x="239" y="82" text-anchor="middle" font-family="Geist,'Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2d3142">2 Map</text>
  <text x="239" y="102" text-anchor="middle" font-family="Geist,'Noto Sans SC',sans-serif" font-size="11" fill="#4f5d75">访谈、已知与未知</text>
  <rect x="332" y="56" width="130" height="88" rx="6" fill="rgba(191,69,32,.08)" stroke="#bf4520"/>
  <text x="397" y="82" text-anchor="middle" font-family="Geist,'Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2d3142">3 Converge</text>
  <text x="397" y="102" text-anchor="middle" font-family="Geist,'Noto Sans SC',sans-serif" font-size="11" fill="#4f5d75">三篇打磨到稳定</text>
  <rect x="490" y="56" width="130" height="88" rx="6" fill="#fff" stroke="#bfc0c0"/>
  <text x="555" y="82" text-anchor="middle" font-family="Geist,'Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#2d3142">4 Downstream</text>
  <text x="555" y="102" text-anchor="middle" font-family="Geist,'Noto Sans SC',sans-serif" font-size="11" fill="#4f5d75">impl-plan、test-plan</text>
</svg>
